status: deprecated
summary: >-
  AdColony was a mobile advertising and monetization platform acquired by Digital
  Turbine (2021) and subsequently merged into the DT Exchange. The AdColony brand,
  developer portal, and monetization SDKs have been deprecated. www.adcolony.com
  now 308-redirects to digitalturbine.com; developers are directed to Digital
  Turbine's DT FairBid / DT Exchange products.
deprecation:
  deprecated: true
  reason: acquired-and-merged
  successor: Digital Turbine (DT Exchange / DT FairBid)
  successor_url: https://www.digitalturbine.com/app-developers/#monetizationsolutions
  announcement: >-
    The AdColony-iOS-SDK README carries a first-party deprecation banner —
    "Deprecated. This library has been depracated, please visit
    digitalturbine.com/app-developers/#monetizationsolutions website for alternative
    options." — which is the provider's own end-of-life notice.
  sunset_notes:
  - AdColony publisher account access retained for accounting purposes only until 2024-03-31.
  - AdColony mediation adapters marked "Deprecated" by Google AdMob / Ad Manager; publishers
    directed to remove the AdColony SDK and adapter.
  - AdColony-iOS-SDK GitHub repository archived (read-only).
  - >-
    Every AdColony developer host is gone. api./docs./developers./help./android.adcolony.com
    no longer resolve; support.adcolony.com resolves but accepts no connection, taking the
    Publisher Reporting API v2.3 PDF with it.
  - >-
    The hosted API class references are dead: the Appledoc (iOS 4.9.0) and Javadoc
    (Android 4.8.0) bundles linked from the SDK wikis both return HTTP 403 from
    adcolony-www-common.s3.amazonaws.com.
  standards_compliance: none
  standards_note: >-
    No RFC 8594 Sunset header, no Deprecation header, and no dated machine-readable
    deprecation signal was ever published. The end-of-life is communicated only in
    README prose and a site-wide redirect.
  contact: monetization@digitalturbine.com
