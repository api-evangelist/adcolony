- version: 4.7.1
  platform: android
  date: '2022-03-30'
  breaking: false
  additions:
  - Google Designed For Families (DFF) compliance changes.
  fixes:
  - Fixed missing click callback in banner integrations.
- version: 4.8.0
  platform: ios
  date: '2022-03-10'
  breaking: true
  breaking_note: >-
    Configure interface changed; the previous configure interface was deprecated
    in the same release.
  additions:
  - Allow banner ad request without a UIViewController at request time.
  - Updated Open Measurement (OM) SDK to v1.3.30.
  fixes:
  - SDK no longer overwrites the host app audio session category.
  - Fixed ad freeze caused by untimely audio-session configuration.
- version: 4.7.0
  platform: android
  date: '2022-03-10'
  breaking: true
  breaking_note: Configure interface changed; the old one was deprecated.
  additions:
  - Updated Open Measurement (OM) SDK to v1.3.30.
  fixes:
  - Fixed NullPointerException on virtual method invocation.
  - Fixed ClassNotFoundException for android.webkit.RenderProcessGoneDetail.
- version: 4.6.5
  platform: android
  date: '2021-10-21'
  breaking: false
  additions:
  - AD_ID permission support for Android 12.
- version: 4.7.2
  platform: ios
  date: '2021-09-13'
  breaking: false
  additions:
  - Additional SKOverlay controls for creatives.
- version: 4.7.0
  platform: ios
  date: '2021-08-03'
  breaking: true
  breaking_note: >-
    Removed the public block interface and the native ad view API — a removal of
    published surface, not a deprecation.
  additions:
  - Mac M1 emulator support.
  - Optimized data returned via collectSignals().
- version: 4.6.1
  platform: ios
  date: '2021-04-21'
  breaking: false
  additions:
  - SKAdNetwork view-through attribution support.
  - Build requires Xcode 12.5.
- version: 4.4.0
  platform: ios
  date: '2020-09-18'
  breaking: false
  additions:
  - iOS 14 support.
- version: 4.3.0
