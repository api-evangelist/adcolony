name: AdColony
description: AdColony was a mobile advertising and app-monetization company known for its
  high-definition video and interactive (Aurora HD) mobile ad SDKs and its Publisher and Advertiser
  reporting APIs. AdColony was acquired by Digital Turbine in 2021; adcolony.com and its developer
  support/docs hosts now 308-redirect to digitalturbine.com, so the historical reporting-API
  and helpdesk documentation is no longer served. The first-party AdColony mobile ads SDKs
  for iOS (CocoaPods) and Android (Maven Central) remain published, and the iOS SDK source
  remains archived on GitHub.
